services:

  db:
    image: postgres:16-alpine
    container_name: grades_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grades_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grades_pass}
      POSTGRES_DB: ${POSTGRES_DB:-grades_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-grades_user} -d $${POSTGRES_DB:-grades_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grades_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-grades_user}:${POSTGRES_PASSWORD:-grades_pass}@db:5432/${POSTGRES_DB:-grades_db}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
